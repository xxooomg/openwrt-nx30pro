name: Build ImmortalWrt for H3C NX30Pro

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune --all --force
        sudo -E apt-get -y update
        sudo -E apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl util-linux gperf autopoint libelf-dev libfuse-dev libtool automake autoconf subversion upx-ucl upx
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean
        df -h

    - name: Clone Source Code
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git openwrt

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Customize Configuration
      run: |
        cd openwrt
        
        # H3C NX30Pro (MT7981 Filogic) 基础配置及所需功能组件
        cat << 'EOF' > .config
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_h3c_nx30pro=y
        
        # IPv6 支持
        CONFIG_IPV6=y
        CONFIG_PACKAGE_ipv6helper=y
        CONFIG_PACKAGE_odhcp6c=y
        CONFIG_PACKAGE_odhcpd-ipv6only=y
        
        # IPTV & udpxy 支持
        CONFIG_PACKAGE_kmod-ipt-core=y
        CONFIG_PACKAGE_kmod-nf-ipt=y
        CONFIG_PACKAGE_udpxy=y
        CONFIG_PACKAGE_luci-app-udpxy=y
        
        # KMS 服务器
        CONFIG_PACKAGE_vlmcsd=y
        CONFIG_PACKAGE_luci-app-vlmcsd=y
        
        # ZeroTier 支持
        CONFIG_PACKAGE_zerotier=y
        CONFIG_PACKAGE_luci-app-zerotier=y
        
        # 系统与常用 LuCI 界面
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        EOF

        make defconfig

    - name: Download Package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread build."
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files
      id: organize
      if: success()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages || true
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt-NX30Pro
        path: ${{ env.FIRMWARE }}
